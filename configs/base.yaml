project:
  name: thesis-v2
  method: non_apf

environment:
  num_uavs: 3
  render_mode: headless
  max_steps: 1800
  ctrl_freq: 48
  sim_freq: 240
  mission_stage: 3

mission:
  target_altitude: 1.0
  start_x: 0.0
  goal_x: 7.0

formation:
  initial: triangle
  preferred: triangle
  alternative: line
  triangle_side: 1.20
  spacing: 0.70
  transition_steps: 160

control:
  reference_max_vx: 0.25
  reference_max_vy: 0.18
  reference_max_vz: 0.14
  correction_scale: 0.06
  velocity_lookahead: 0.30
  kp_center: 0.32
  kp_form: 0.60
  kp_alt: 0.45

training:
  episodes: 3000
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95

evaluation:
  episodes: 10
  deterministic: true

communication:
  use_neighbor_dropout: true
  neighbor_dropout_prob: 0.02

obstacle_avoidance:
  use_apf: false