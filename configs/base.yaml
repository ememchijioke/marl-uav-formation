project:
  name: thesis-v2
  method: non_apf

environment:
  scenario: easy_city
  render_mode: headless
  num_agents: 3
  max_steps: 1800
  ctrl_freq: 48
  sim_freq: 240

mission:
  target_altitude: 1.0
  start_x: 0.0
  goal_x: 7.0
  goal_tolerance: 0.40
  goal_hold_steps: 36

formation:
  initial: triangle
  spacing: 0.70
  transition_steps: 120
  cooldown_steps: 96

control:
  max_velocity:
    x: 0.35
    y: 0.30
    z: 0.20
  velocity_lookahead: 0.30

safety:
  min_separation: 0.30
  obstacle_safe_clearance: 0.18
  drone_radius: 0.08

training:
  episodes: 3000
  learning_rate: 0.0003
  value_learning_rate: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  seed: 42

evaluation:
  episodes: 10
  seed: 1000
